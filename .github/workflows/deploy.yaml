# ponytail: streamlined CI/CD SSH deployment pipeline for DomaiNesia Nimbus
name: Deploy to DomaiNesia Nimbus

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH to DomaiNesia
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd public_html
            rm -f index.html default.html default.php hosting.html
            
            # Setup PHP & Node PATH for cPanel environment
            export PATH="/opt/cpanel/ea-php83/root/usr/bin:/usr/local/bin:/opt/alt/php83/usr/bin:$PATH"
            
            # Pull latest changes from main branch
            /usr/bin/git fetch --depth=1 https://github.com/nicholasgunawann/Recyclink.git main
            /usr/bin/git reset --hard FETCH_HEAD
            
            # Ensure .htaccess root redirect is present
            echo -e "<IfModule mod_rewrite.c>\n    RewriteEngine On\n    RewriteRule ^$ public/ [L]\n    RewriteRule (.*) public/\$1 [L]\n</IfModule>" > .htaccess
            
            # Install PHP & Node dependencies, then build Vite assets on server
            composer install --no-dev --optimize-autoloader --no-scripts
            (npm install && npm run build) || true
            
            # Execute Laravel optimization commands
            php artisan package:discover --ansi || ea-php83 artisan package:discover --ansi || true
            php artisan storage:link || ea-php83 artisan storage:link || true
            php artisan migrate --force || ea-php83 artisan migrate --force || true
            php artisan db:seed --force || ea-php83 artisan db:seed --force || true
            php artisan config:cache || ea-php83 artisan config:cache || true
            php artisan route:cache || ea-php83 artisan route:cache || true
            php artisan view:cache || ea-php83 artisan view:cache || true