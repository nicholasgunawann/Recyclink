# ponytail: complete CI/CD SSH deployment pipeline for DomaiNesia Nimbus
name: Deploy to DomaiNesia Nimbus

on:
  push:
    branches: [ main ]

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, bcmath, ctype, xml, json, zip
          tools: composer:v2

      - name: Copy Env
        run: cp .env.example .env

      - name: Install Dependencies
        run: composer install --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist --ignore-platform-reqs

      - name: Generate Key
        run: php artisan key:generate

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Assets for Tests
        run: |
          npm install
          npm run build

      - name: Run Tests
        run: php artisan test

      - name: Deploy via SSH to DomaiNesia
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd public_html
            /usr/bin/git fetch --depth=1 https://github.com/nicholasgunawann/Recyclink.git main
            /usr/bin/git checkout -f FETCH_HEAD
            composer install --no-dev --optimize-autoloader
            php artisan migrate --force
            php artisan db:seed --force
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache